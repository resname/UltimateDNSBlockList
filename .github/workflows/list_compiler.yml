name: Compile List

# Controls when the workflow will run
on:
  # Run all list builds every hour
  schedule:
    - cron: '25 * * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: blocklist-publish-${{ github.ref }}
  cancel-in-progress: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6

      - name: Compile all blocklists
        run: |
          mkdir -p list
          work_dir=$(mktemp -d)
          trap 'rm -rf "$work_dir"' EXIT
          declare -a output_files titles descriptions body_files
          content_changed=0

          compile_list() {
            local source_file="$1"
            local output_file="$2"
            local title="$3"
            local description="$4"
            local index="${#output_files[@]}"
            local source_data="$work_dir/$index-sources.txt"
            local old_data="$work_dir/$index-old.txt"
            local cleaned_data="$work_dir/$index-cleaned.txt"
            : > "$source_data"

            while IFS= read -r url || [ -n "$url" ]; do
              if [ -n "$url" ]; then
                echo "Downloading $url"
                curl -fsSL --max-time 120 --retry 3 --retry-delay 5 "$url" >> "$source_data" || {
                  echo "ERROR: Failed to download $url" >&2
                  return 1
                }
              fi
            done < "$source_file"

            if [ ! -s "$source_data" ]; then
              echo "ERROR: No source content downloaded from $source_file" >&2
              return 1
            fi

            awk '!seen[$0]++' "$source_data" > "$work_dir/$index-unique.txt"
            if [ -f allowlist ]; then
              sed 's/ *#.*//' allowlist | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' > "$work_dir/allowlist.txt"
              if grep -vFx -f "$work_dir/allowlist.txt" "$work_dir/$index-unique.txt" > "$cleaned_data"; then
                :
              else
                grep_status=$?
                if [ "$grep_status" -ne 1 ]; then
                  echo "ERROR: Failed to apply allowlist" >&2
                  return "$grep_status"
                fi
              fi
            else
              cp "$work_dir/$index-unique.txt" "$cleaned_data"
            fi

            if [ -f "$output_file" ]; then
              sed '1,/! ========== Begin Blocklist ==========/d' "$output_file" > "$old_data"
            else
              : > "$old_data"
            fi

            if ! cmp -s "$cleaned_data" "$old_data"; then
              content_changed=1
            fi

            output_files+=("$output_file")
            titles+=("$title")
            descriptions+=("$description")
            body_files+=("$cleaned_data")
          }

          compile_list Sources/sources.txt list/UltimateDNSBlockList.txt UltimateDNSBlockList "The only DNS blocklist you will ever need."
          compile_list Sources/sources-small.txt list/SmallDNSBlockList.txt SmallDNSBlockList "A smaller DNS blocklist for lighter-weight protection."
          compile_list Sources/sources-nsfw.txt list/NSFWBlockList.txt NSFWBlockList "Blocks adult content."
          compile_list Sources/sources-nsfw-small.txt list/SmallNSFWBlockList.txt SmallNSFWBlockList "A smaller blocklist for adult content."

          if [ ! -f version.txt ]; then echo "0.00" > version.txt; fi
          current_version=$(cat version.txt)
          if [ "$content_changed" -eq 1 ]; then
            current_version=$(awk "BEGIN {printf \"%.2f\", $current_version + 0.01}")
            echo "$current_version" > version.txt
          fi

          last_modified=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          for index in "${!output_files[@]}"; do
            output_file="${output_files[$index]}"
            body_file="${body_files[$index]}"
            line_count=$(wc -l < "$body_file" | xargs)
            existing_version=""
            if [ -f "$output_file" ]; then
              existing_version=$(sed -n 's/^! Version: //p' "$output_file" | head -n 1)
            fi

            if [ "$content_changed" -eq 1 ] || [ "$existing_version" != "$current_version" ] || [ ! -f "$output_file" ]; then
              {
                echo "! Title: ${titles[$index]}"
                echo "! Description: ${descriptions[$index]}"
                echo "! Version: $current_version"
                echo "! Last modified: $last_modified"
                echo "! License: https://github.com/${{ github.repository }}/blob/main/LICENSE"
                echo "!"
                echo "! Line Count: $line_count"
                echo "!"
                echo "! ========== Begin Blocklist =========="
              } > "$work_dir/header.txt"
              cat "$work_dir/header.txt" "$body_file" > "$output_file"
            else
              echo "No content changes for $output_file."
            fi
          done

      # Commit and push changes if there are any
      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          BRANCH="${GITHUB_REF_NAME:-${GITHUB_REF#refs/heads/}}"
          if [ -z "$BRANCH" ]; then
            echo "ERROR: Unable to determine branch name" >&2
            exit 1
          fi
          git add list/UltimateDNSBlockList.txt list/SmallDNSBlockList.txt \
            list/NSFWBlockList.txt list/SmallNSFWBlockList.txt version.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update DNS blocklists"
          git fetch origin "$BRANCH"
          git rebase FETCH_HEAD
          git push origin HEAD:"$BRANCH"
