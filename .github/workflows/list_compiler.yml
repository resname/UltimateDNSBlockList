name: Compile List

# Controls when the workflow will run
on:
  # Run all list builds every hour
  schedule:
    - cron: '25 * * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: blocklist-publish-${{ github.ref }}
  cancel-in-progress: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6

      - name: Compile all blocklists
        run: |
          mkdir -p lists
          compile_list() {
            local source_file="$1"
            local output_file="$2"
            local version_file="$3"
            local title="$4"
            local description="$5"
            local work_dir
            work_dir=$(mktemp -d)

            while IFS= read -r url || [ -n "$url" ]; do
              if [ -n "$url" ]; then
                echo "Downloading $url"
                curl -fsSL --max-time 120 --retry 3 --retry-delay 5 "$url" >> "$work_dir/sources.txt" || {
                  echo "ERROR: Failed to download $url" >&2
                  rm -rf "$work_dir"
                  return 1
                }
              fi
            done < "$source_file"

            if [ ! -s "$work_dir/sources.txt" ]; then
              echo "ERROR: No source content downloaded from $source_file" >&2
              rm -rf "$work_dir"
              return 1
            fi

            awk '!seen[$0]++' "$work_dir/sources.txt" > "$work_dir/unique.txt"
            if [ -f allowlist ]; then
              sed 's/ *#.*//' allowlist | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' > "$work_dir/allowlist.txt"
              if grep -vFx -f "$work_dir/allowlist.txt" "$work_dir/unique.txt" > "$work_dir/cleaned.txt"; then
                :
              else
                grep_status=$?
                if [ "$grep_status" -ne 1 ]; then
                  echo "ERROR: Failed to apply allowlist" >&2
                  rm -rf "$work_dir"
                  return "$grep_status"
                fi
              fi
            else
              cp "$work_dir/unique.txt" "$work_dir/cleaned.txt"
            fi

            if [ -f "$output_file" ]; then
              sed '1,/! ========== Begin Blocklist ==========/d' "$output_file" > "$work_dir/old.txt"
            else
              : > "$work_dir/old.txt"
            fi

            if cmp -s "$work_dir/cleaned.txt" "$work_dir/old.txt"; then
              echo "No content changes for $output_file."
              rm -rf "$work_dir"
              return 0
            fi

            if [ ! -f "$version_file" ]; then echo "0.00" > "$version_file"; fi
            current_version=$(cat "$version_file")
            new_version=$(awk "BEGIN {printf \"%.2f\", $current_version + 0.01}")
            echo "$new_version" > "$version_file"

            {
              echo "! Title: $title"
              echo "! Description: $description"
              echo "! Version: $new_version"
              echo "! Last modified: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
              echo "! License: https://github.com/${{ github.repository }}/blob/main/LICENSE"
              echo "!"
              echo "! Line Count: $(wc -l < "$work_dir/cleaned.txt" | xargs)"
              echo "!"
              echo "! ========== Begin Blocklist =========="
            } > "$work_dir/header.txt"
            cat "$work_dir/header.txt" "$work_dir/cleaned.txt" > "$output_file"
            rm -rf "$work_dir"
          }

          compile_list Sources/sources.txt lists/UltimateDNSBlockList.txt version.txt UltimateDNSBlockList "The only DNS blocklist you will ever need."
          compile_list Sources/sources-small.txt lists/SmallDNSBlockList.txt small-version.txt SmallDNSBlockList "A smaller DNS blocklist for lighter-weight protection."
          compile_list Sources/sources-nsfw.txt lists/NSFWBlockList.txt nsfw-version.txt NSFWBlockList "Blocks adult content."
          compile_list Sources/sources-nsfw-small.txt lists/SmallNSFWBlockList.txt nsfw-small-version.txt SmallNSFWBlockList "A smaller blocklist for adult content."

      # Commit and push changes if there are any
      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          BRANCH="${GITHUB_REF_NAME:-${GITHUB_REF#refs/heads/}}"
          if [ -z "$BRANCH" ]; then
            echo "ERROR: Unable to determine branch name" >&2
            exit 1
          fi
          git add lists/UltimateDNSBlockList.txt version.txt lists/SmallDNSBlockList.txt small-version.txt \
            lists/NSFWBlockList.txt nsfw-version.txt lists/SmallNSFWBlockList.txt nsfw-small-version.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update DNS blocklists"
          git fetch origin "$BRANCH"
          git rebase FETCH_HEAD
          git push origin HEAD:"$BRANCH"
